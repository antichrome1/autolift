name: Build autolift release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Print version info
      run: make info

    - name: Build
      run: make release

    - name: Run tests
      run: make test

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" autolift \
        --repo "${{ github.repository }}" \
        --title "${GITHUB_REF_NAME}" \
        --generate-notes
